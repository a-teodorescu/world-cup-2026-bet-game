[functions]
  directory = "netlify/functions"
  included_files = ["matches.js"]


# 00:15 UTC = 03:15 Romania time in June/July 2026.
# Sync real knockout team names before score sync and daily emails.
[functions."sync-knockout-fixtures"]
  schedule = "15 0 * * *"

# Runs every 30 minutes, but the function calls football-data.org only when a match is due:
# first sync at match start + 2h30; retry at match start + 3h30 if no result was saved.
[functions."sync-football-data-results"]
  schedule = "*/30 * * * *"

# Netlify Scheduled Functions use UTC cron.
# 01:00 UTC = 04:00 Romania time in June/July 2026.
[functions."scheduled-daily-emails"]
  schedule = "0 1 * * *"

# Test-only runner. Runs every minute and checks Supabase for one-time test jobs.
# Does not change the real 04:00 automation above.
[functions."scheduled-email-test-runner"]
  schedule = "* * * * *"
